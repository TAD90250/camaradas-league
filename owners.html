<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owners</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main>
  <div class="wrap">
    <p class="note">All-time numbers include regular season, playoffs and consolation games. Click a column to sort, or a name for the full profile. <a href="alltime.html">See the all-time stat tables &rarr;</a></p>
    <div class="card table-wrap"><table id="tbl"></table></div>
  </div>
</main>
<script src="assets/site.js"></script>
<script>
L.boot("owners.html", "Owners", async (meta) => {
  const { $, esc, getJSON, rec, pct, num, ownerLink } = L;
  const owners = await getJSON("data/owners.json");
  $("#pageSub").textContent = owners.length + " owners · " + meta.champions.length + " champions · sorted by titles, then win %";
  $("#tbl").innerHTML = "<thead><tr><th data-sort>#</th><th class='l' data-sort>Owner</th><th data-sort>Titles</th><th data-sort>Runner-up</th><th data-sort>Playoffs</th>" +
    "<th data-sort>Seasons</th><th data-sort>Record</th><th data-sort>Win %</th><th data-sort>Avg PF</th><th class='l'>Years</th></tr></thead><tbody>" +
    owners.map((o, i) => "<tr><td class='rank' data-v='" + (i + 1) + "'>" + (i + 1) + "</td><td class='l'><b>" + ownerLink(o.slug, o.nick) + "</b></td>" +
      "<td data-v='" + o.titles + "'>" + (o.titles ? "🏆".repeat(Math.min(o.titles, 4)) + (o.titles > 4 ? "+" : "") + " " + o.titles : "–") + "</td>" +
      "<td>" + (o.runnerUps || "–") + "</td><td>" + o.playoffApps + "</td><td>" + o.seasons + "</td>" +
      "<td data-v='" + o.w + "'>" + rec(o.w, o.l, o.t) + "</td><td data-v='" + (o.pct || 0) + "'>" + pct(o.pct) + "</td><td>" + num(o.avgPf) + "</td>" +
      "<td class='l muted'>" + (o.firstYear === o.lastYear ? o.firstYear : o.firstYear + "–" + o.lastYear) + "</td></tr>").join("") + "</tbody>";
  L.sortable($("#tbl"));
});
</script>
</body>
</html>
