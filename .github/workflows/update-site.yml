# Updates the Camaradas League site several times a week, with no computer of yours involved.
#   Monday   10:30 PM : final scores after Monday night football
#   Thursday  8:00 AM : refresh scores and Power Rankings projections before the new week
#   Thursday 10:30 PM : after the Thursday night game
#   Sunday    1:30 PM : after the 10 AM games
#   Sunday    4:50 PM : after the 1 PM games
#   Sunday   10:30 PM : after the Sunday night game
# GitHub reads cron in UTC. The times below are Pacific STANDARD time (UTC-8), which applies from Nov 1.
# You can also run it by hand: Actions tab > "Update site data" > Run workflow.
name: Update site data

on:
  schedule:
    - cron: "30 6 * * 2"    # Monday    10:30 PM Pacific (Tuesday 06:30 UTC)
    - cron: "0 16 * * 4"    # Thursday   8:00 AM Pacific (Thursday 16:00 UTC)
    - cron: "30 6 * * 5"    # Thursday  10:30 PM Pacific (Friday 06:30 UTC)
    - cron: "30 21 * * 0"   # Sunday     1:30 PM Pacific (Sunday 21:30 UTC)
    - cron: "50 0 * * 1"    # Sunday     4:50 PM Pacific (Monday 00:50 UTC)
    - cron: "30 6 * * 1"    # Sunday    10:30 PM Pacific (Monday 06:30 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r tools/requirements.txt

      - name: Pull the latest Sleeper scores into the workbook
        working-directory: tools
        run: python sleeper_backfill.py weekly

      - name: Pull projections for the Power Rankings
        working-directory: tools
        continue-on-error: true      # if Sleeper projections fail, the rest of the site still updates
        run: python fetch_projections.py

      - name: Rebuild the site data
        working-directory: tools
        run: python export_site_data.py --out ../data

      - name: Remove workbook backup copies
        run: rm -f tools/*_backup_*.xlsx

      - name: Save the changes
        run: |
          git config user.name "league-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update league data"
            git pull --rebase
            git push
          fi

      - name: Ask GitHub Pages to publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
